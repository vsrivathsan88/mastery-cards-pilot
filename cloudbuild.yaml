# Cloud Build configuration for mastery-cards
# This file should be at the repository root
steps:
  # Build the container image from the subdirectory
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mastery-cards:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mastery-cards:latest'
      - '-f'
      - 'apps/mastery-cards-app/native-audio-function-call-sandbox/Dockerfile'
      - 'apps/mastery-cards-app/native-audio-function-call-sandbox'

  # Push the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/mastery-cards:$COMMIT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mastery-cards'
      - '--image'
      - 'gcr.io/$PROJECT_ID/mastery-cards:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/mastery-cards:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/mastery-cards:latest'

# Explicitly declare substitution variables
substitutions:
  _SERVICE_NAME: mastery-cards
  _REGION: us-central1

timeout: '1200s'
